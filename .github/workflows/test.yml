name: Test

# Installs BoardClip exactly the way the README tells people to, on clean
# runners, from this repo's main branch on GitHub.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    name: Homebrew (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install
        run: brew install --cask tobq/tap/boardclip

      - name: Style and audit
        run: |
          brew style --cask tobq/tap/boardclip
          brew audit --cask tobq/tap/boardclip

      # The postflight step must have removed the download quarantine flag (so
      # Gatekeeper never asks), and the bundle must still carry a valid signature.
      - name: Not quarantined, signature valid
        run: |
          APP=/Applications/BoardClip.app
          if xattr -p com.apple.quarantine "$APP" >/dev/null 2>&1; then
            echo "BoardClip.app is still quarantined"; exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Authority|Signature|TeamIdentifier' || true
          codesign -d -r- "$APP" 2>&1 | grep designated || true

      # By path: `open -a <name>` asks LaunchServices, which may not have indexed a
      # just-installed app yet (macOS 26: "Unable to find application named").
      - name: Launches
        run: |
          open /Applications/BoardClip.app
          for i in $(seq 1 30); do
            if pgrep -f "BoardClip.app/Contents/MacOS/BoardClip" >/dev/null; then echo "running after ${i}s"; break; fi
            sleep 1
          done
          pgrep -f "BoardClip.app/Contents/MacOS/BoardClip"
          osascript -e 'quit app "BoardClip"' || pkill -f "BoardClip.app/Contents/MacOS/BoardClip" || true

      - name: Uninstall
        run: brew uninstall --cask boardclip

  windows:
    name: Scoop (windows-2025)
    runs-on: windows-2025
    steps:
      - name: Install
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add tobq https://github.com/tobq/homebrew-tap
          scoop install tobq/boardclip
          $exe = "$env:USERPROFILE\scoop\apps\boardclip\current\BoardClip.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:USERPROFILE\scoop\apps\boardclip\current"; throw "BoardClip.exe missing" }
          (Get-Item $exe).VersionInfo | Format-List ProductVersion, FileVersion
          scoop uninstall boardclip
